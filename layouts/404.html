{{- define "main" }}
<script>
  const fallback_url = '{{ absLangURL "" }}';

  var url = window.location.href;
  if (url.includes('/categories/') 
   || url.includes('/category/')
   || url.includes('/tags/')
   || url.includes('/tag/')) {
    window.location.href = fallback_url;
  }
</script>
<div class="not-found">404</div>
{{- end }}{{/* end main */ -}}
