baseURL: https://renate.buckdahn.de/
title: Renate Buckdahn
theme: ["hugo-video", "PaperMod"]

locale: de
defaultContentLanguage: de

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

caches:
  images:
    dir: :cacheDir/images

minify:
  disableXML: true
  minifyOutput: true

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags
  colour: colours

permalinks:
  blog: /:year/:slug/

menu:
  main:
    - name: Familie
      url: https://buckdahn.de
      weight: 10
    - name: Suche
      url: search/
      weight: 90

params:
  env: production

  title: Renate Buckdahn
  description: "Meine LEGO-Modelle"
  keywords: [Blog, LEGO]
  author: Renate Buckdahn

  DateFormat: "02.01.2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: false
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: true
  hideFooter: true
  showtoc: true
  tocopen: false

  assets:
    disableHLJS: false # code highlighting
    disableFingerprinting: false # css integrity hashes

  cover:
    linkFullImages: true

  footer:
    text: "[Impressum](/impressum) | [Datenschutz](/datenschutz)"

  label:
    text: "Renate"
    icon: "favicon-32x32.png"
    iconHeight: "32"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    keys: ["title", "permalink", "summary", "content"]
    # limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
